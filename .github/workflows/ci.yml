name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    uses: ./.github/workflows/reusable-go-test.yml
    with:
      runner: ${{ matrix.os }}

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
            archive_ext: tar.gz
            client_bin: jetkvm-desktop
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            archive_ext: tar.gz
            client_bin: jetkvm-desktop
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            name: macos-amd64
            archive_ext: tar.gz
            client_bin: jetkvm-desktop
            goos: darwin
            goarch: amd64
          - os: macos-15
            name: macos-aarch64
            archive_ext: tar.gz
            client_bin: jetkvm-desktop
            goos: darwin
            goarch: arm64
          - os: windows-latest
            name: windows-amd64
            archive_ext: zip
            client_bin: jetkvm-desktop.exe
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute build number
        id: version
        shell: bash
        run: echo "version=$(scripts/build-number)" >> "$GITHUB_OUTPUT"

      - name: Set up native environment
        uses: ./.github/actions/setup-native-env

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/pkg
          go build -trimpath -ldflags="-s -w" -o "dist/pkg/${{ matrix.client_bin }}" ./cmd/jetkvm-desktop
          cp README.md dist/pkg/
          tar -C dist/pkg -czf "dist/jetkvm-desktop-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz" .

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/pkg | Out-Null
          $env:CGO_LDFLAGS = "-static"
          go build -trimpath -ldflags='-s -w -extldflags "-static"' -o "dist/pkg/${{ matrix.client_bin }}" ./cmd/jetkvm-desktop
          Copy-Item README.md dist/pkg/README.md
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/jetkvm-desktop-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"

      - name: Verify Windows DLL dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/pkg/${{ matrix.client_bin }}"
          $imports = & objdump -p $exe |
            Select-String "DLL Name:" |
            ForEach-Object { $_.ToString().Split(":", 2)[1].Trim().ToLowerInvariant() }

          if (-not $imports) {
            throw "Failed to detect imported DLLs for $exe"
          }

          Write-Host "Imported DLLs:"
          $imports | Sort-Object -Unique | ForEach-Object { Write-Host " - $_" }

          $allowedImports = @(
            "kernel32.dll",
            "msvcrt.dll"
          )

          $unexpectedImports = $imports |
            Where-Object { $allowedImports -notcontains $_ } |
            Sort-Object -Unique
          if ($unexpectedImports) {
            throw "Windows binary imports unexpected DLLs: $($unexpectedImports -join ', ')"
          }

          # Imports do not reveal DLLs opened at runtime with LoadLibrary. Scan both
          # ASCII and UTF-16LE strings so known external runtime families cannot be
          # introduced as dynamically loaded dependencies without failing CI.
          $binaryStrings = @(
            & strings -a $exe
            & strings -a -el $exe
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract strings from $exe"
          }

          $forbiddenDynamicDLLs = [ordered]@{
            "MinGW libstdc++" = '(?i)libstdc\+\+-[^\\/:*?"<>|\s]*\.dll'
            "MinGW libgcc" = '(?i)libgcc[^\\/:*?"<>|\s]*\.dll'
            "MinGW winpthreads" = '(?i)libwinpthread[^\\/:*?"<>|\s]*\.dll'
            "MinGW libssp" = '(?i)libssp[^\\/:*?"<>|\s]*\.dll'
            "LLVM libc++" = '(?i)libc\+\+[^\\/:*?"<>|\s]*\.dll'
            "LLVM libunwind" = '(?i)libunwind[^\\/:*?"<>|\s]*\.dll'
            "Microsoft C++ runtime" = '(?i)(?:msvcp|vcruntime)[0-9_]*\.dll'
            "OpenH264" = '(?i)openh264[^\\/:*?"<>|\s]*\.dll'
            "FFmpeg" = '(?i)(?:avcodec|avformat|avutil|swresample|swscale)[^\\/:*?"<>|\s]*\.dll'
            "OpenSSL" = '(?i)lib(?:crypto|ssl)[^\\/:*?"<>|\s]*\.dll'
            "SDL" = '(?i)sdl[0-9_+-]*\.dll'
            "zlib" = '(?i)zlib[^\\/:*?"<>|\s]*\.dll'
          }

          $dynamicViolations = foreach ($entry in $forbiddenDynamicDLLs.GetEnumerator()) {
            if ($binaryStrings | Where-Object { $_ -match $entry.Value } | Select-Object -First 1) {
              $entry.Key
            }
          }
          if ($dynamicViolations) {
            throw "Windows binary references external runtime DLLs: $($dynamicViolations -join ', ')"
          }

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/jetkvm-desktop-${{ steps.version.outputs.version }}-${{ matrix.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
